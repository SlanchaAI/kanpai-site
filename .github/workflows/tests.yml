name: Whole repository tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  whole-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run full inventory and browser checks
        run: bash tests/verify_whole_tests.sh
      - name: Publish inventory and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-tests-coverage
          path: .test-output/
          include-hidden-files: true
          retention-days: 7
